[project]
name = "api"
version = "0.1.0"
description = "api to scrape paper"
authors = [
    {name = "danielhilfer@outlook.de"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "bcrypt (<4.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "aiosmtplib (>=5.1.2,<6.0.0)",
    "apscheduler (>=3.11.3,<4.0.0)",
    "sqlalchemy-libsql (>=0.2.0,<0.3.0)"
    
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.0"
pytest = "^8.4.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Body()/etc. are meant to be used as call defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# This project isn't an installable package (see package-mode above) - tell
# uv (used by Vercel's Python builder) to just install the dependencies
# instead of trying to build/install this project itself.
package = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
